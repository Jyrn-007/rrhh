services:
  api:
    build: ./backend
    container_name: kitsune-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8081}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: ${DB_CONNECTION}
      Jwt__Key: ${JWT_KEY}
      Cors__Origins__0: ${CORS_ORIGIN:-http://localhost:5173}
